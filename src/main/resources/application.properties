# =============================================
# CloudBite - Application Configuration
# =============================================

spring.application.name=cloudbite-backend

# =============================================
# DATABASE (Aiven MySQL) - Update these values
# =============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:your-aiven-host}:${DB_PORT:3306}/${DB_NAME:cloudbite}?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:your-db-username}
spring.datasource.password=${DB_PASSWORD:your-db-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT Configuration
# =============================================
app.jwt.secret=${JWT_SECRET:CloudBite_SuperSecret_JWT_Key_2024_ChangeInProduction}
app.jwt.expiration=86400000
app.jwt.refreshExpiration=604800000

# =============================================
# Razorpay Configuration
# =============================================
razorpay.key.id=${RAZORPAY_KEY_ID:your-razorpay-key-id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your-razorpay-key-secret}

# =============================================
# CORS Configuration
# =============================================
app.cors.allowedOrigins=${FRONTEND_URL:http://localhost:5173,https://your-vercel-app.vercel.app}

# =============================================
# Server Configuration
# =============================================
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# =============================================
# Mail Configuration (for future notifications)
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:cloudbiteowner@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================
# Admin Default Credentials
# =============================================
app.admin.email=cloudbiteowner@gmail.com
app.admin.password=${ADMIN_PASSWORD:CloudBite@Admin2024}
app.admin.name=CloudBite Admin

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# Logging
# =============================================
logging.level.com.cloudbite=INFO
logging.level.org.springframework.security=WARN
