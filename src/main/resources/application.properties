# =============================================
# CloudBite - Application Configuration
# =============================================

spring.application.name=cloudbite-backend

# =============================================
# DATABASE (Aiven MySQL / Render env)
# =============================================
# Prefer a full JDBC URL when the provider supplies a custom host/port pair.
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT Configuration
# =============================================
app.jwt.secret=${JWT_SECRET:CloudBite_SuperSecret_JWT_Key_2024_ChangeInProduction}
app.jwt.expiration=86400000
app.jwt.refreshExpiration=604800000

# =============================================
# Razorpay Configuration
# =============================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_Sc9JA2v6zV9u44}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:UP50DWLHIXMn5vs19TZPiqaH}

# =============================================
# Demo Mode (Set to true for college projects without KYC)
# =============================================
app.demo.mode=${DEMO_MODE:false}

# =============================================
# CORS Configuration
# =============================================
app.cors.allowedOrigins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,https://cloudbite-ui.vercel.app}}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# =============================================
# Server Configuration
# =============================================
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# =============================================
# Mail Configuration
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:cloudbiteowner@gmail.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:your-app-password}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================
# Admin Default Credentials
# =============================================
app.admin.email=cloudbiteowner@gmail.com
app.admin.password=${ADMIN_PASSWORD:CloudBite@Admin2024}
app.admin.name=CloudBite Admin

# =============================================
# File Upload
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# Logging
# =============================================
logging.level.com.cloudbite=INFO
logging.level.org.springframework.security=WARN
